dist: jammy

language: python

matrix:
  include:
    - python: '3.10'
    - python: '3.11'
    - python: '3.12'
    - python: '3.13'

install:
  - pip install --upgrade pip
  - pip install .[dev]

addons:
  apt:
    packages:
      - libiscsi-dev

script:
  - pytest
